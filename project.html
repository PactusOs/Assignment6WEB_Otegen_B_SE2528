<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="brand">jQuery</div>
            <nav>
                <a href="index.html">Basics</a>
                <a href="effects.html">Effects</a>
                <a href="dom.html">DOM</a>
                <a href="animations.html">Animations</a>
                <a href="project.html" class="active">Accordion</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Accordion Menu</h1>
        <section class="card">
            <h2>jQuery FAQ</h2>
            <button class="accordion-title">What is jQuery?</button>
            <div class="accordion-content">
                <p>jQuery is a JavaScript library for working with HTML, events and animations.</p>
            </div>

            <button class="accordion-title">How can I select an element?</button>
            <div class="accordion-content">
                <p>Use $("#id") for an ID, $(".class") for a class, and $("p") for a tag.</p>
            </div>

            <button class="accordion-title">What does slideToggle() do?</button>
            <div class="accordion-content">
                <p>It opens or closes a section with a sliding animation.</p>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
